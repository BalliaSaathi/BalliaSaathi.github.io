<!DOCTYPE html>
<html>
<head>
<title>Parcel</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:system-ui;background:#f0fdf4;padding:20px}
input{width:100%;padding:12px;margin:10px 0;border-radius:8px}
button{background:#16a34a;color:white;padding:14px;border:none;width:100%;font-size:18px;border-radius:12px}
</style>
</head>
<body>

<h2>Send Parcel</h2>

<input id="pickup" placeholder="Pickup address">
<input id="drop" placeholder="Delivery address">
<input id="item" placeholder="Parcel me kya hai">

<button onclick="parcel()">Send Parcel</button>

<script>
function parcel(){
let p=document.getElementById("pickup").value;
let d=document.getElementById("drop").value;
let i=document.getElementById("item").value;
let msg="Parcel Delivery:%0AFrom: "+p+"%0ATo: "+d+"%0AItem: "+i;
window.location="https://wa.me/919580009550?text="+msg;
}
</script>

</body>
</html>
