<!DOCTYPE html>
<html>
<head>
<title>Ballia Saathi</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;font-family:system-ui;background:#ecfdf5;text-align:center}
.hero{height:100vh;background:linear-gradient(135deg,#16a34a,#22c55e);color:white;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative}
h1{font-size:48px;margin:0}
.tag{margin:10px}

.scooter{
position:absolute;
bottom:70px;
right:-200px;
font-size:60px;
animation:ride 8s linear infinite;
}

@keyframes ride{
0%{right:-200px}
100%{right:110%}
}

.btn{
display:block;
width:240px;
margin:12px;
padding:16px;
background:white;
color:#16a34a;
text-decoration:none;
font-size:20px;
border-radius:14px;
font-weight:bold;
box-shadow:0 6px 18px rgba(0,0,0,.2);
}

.btn:hover{transform:scale(1.08)}
</style>
</head>

<body>

<div class="hero">
<h1>Ballia Saathi 🛵</h1>
<div class="tag">Ballia ka apna delivery saathi</div>

<a class="btn" href="grocery.html">🛒 Grocery Order</a>
<a class="btn" href="ride.html">🏍 Ride / Pickup</a>
<a class="btn" href="parcel.html">📦 Send Parcel</a>

<div class="scooter">🛵💨</div>
</div>

</body>
</html>
